name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Write optional private denylist from secret
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          if [ -n "$PRIVACY_DENYLIST" ]; then
            umask 077
            printf '%s\n' "$PRIVACY_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            echo "EG_PRIVACY_DENYLIST=$RUNNER_TEMP/denylist.txt" >> "$GITHUB_ENV"
          fi
      - name: Scan tree
        run: python3 scripts/privacy_guard.py --all
      - name: Scan commit messages (pull request)
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/privacy_guard.py
          --git-log "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scan commit messages (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 scripts/privacy_guard.py --git-log "${{ github.event.before }}..${{ github.sha }}"
      - name: Scan commit messages (first push)
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: python3 scripts/privacy_guard.py --git-log "${{ github.sha }}"

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.4"
          args: check
      - run: ruff format --check

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest --cov --cov-report=term-missing
