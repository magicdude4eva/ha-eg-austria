name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy first.** Do not post your portal token or cookie, member number,
        metering point numbers (AT...), names, addresses, email, community names
        you belong to, or real kWh/EUR values. Use the integration's diagnostics
        download (redacted) and check it before attaching. Never attach HAR files
        or portal exports.
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted log excerpt or diagnostics
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, ids, names, addresses, emails and real values.
          required: true
