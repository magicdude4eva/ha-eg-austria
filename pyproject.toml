# Tool configuration only; this is not an installable package.

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "A",     # builtins shadowing
  "ASYNC", # async pitfalls
  "B",     # bugbear
  "C4",    # comprehensions
  "D",     # docstrings
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "G",     # logging format
  "I",     # isort
  "LOG",   # logging
  "PT",    # pytest style
  "PTH",   # pathlib
  "RET",   # returns
  "RUF",   # ruff-specific
  "S",     # bandit (security)
  "SIM",   # simplify
  "T20",   # print
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
ignore = [
  "D202", # blank line after function docstring (HA style)
  "D203", # conflicts with D211
  "D213", # conflicts with D212
  "E501", # formatter handles line length
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["T201", "S603", "S607"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.eg_austria"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    # Home Assistant's in-memory test recorder recreates its sqlite pool
    # between tests and drops the old connection without closing it; the
    # warning surfaces at whatever line the garbage collector runs on (seen in
    # models.py, sqlalchemy result.py). The integration opens no connection
    # itself (recorder API and session_scope only).
    "ignore:unclosed database in <sqlite3.Connection:ResourceWarning",
]

[tool.coverage.run]
source = ["custom_components.eg_austria"]

[tool.coverage.report]
# Total; per module (>95%, config_flow.py 100%) see scripts/check_coverage.py.
fail_under = 95

[tool.mypy]
# Home Assistant core's settings for integrations on the strict-typing list
# (core mypy.ini), as far as they apply to a custom integration.
python_version = "3.14"
platform = "linux"
files = ["custom_components/eg_austria"]
strict = true
show_error_codes = true
follow_imports = "normal"
local_partial_types = true
strict_bytes = true
warn_incomplete_stub = true
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "ignore-without-code",
  "redundant-self",
  "truthy-iterable",
]
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped"]
extra_checks = false
