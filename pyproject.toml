# Tool configuration only; this is not an installable package.

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "A",     # builtins shadowing
  "ASYNC", # async pitfalls
  "B",     # bugbear
  "C4",    # comprehensions
  "D",     # docstrings
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "G",     # logging format
  "I",     # isort
  "LOG",   # logging
  "PT",    # pytest style
  "PTH",   # pathlib
  "RET",   # returns
  "RUF",   # ruff-specific
  "S",     # bandit (security)
  "SIM",   # simplify
  "T20",   # print
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
ignore = [
  "D202", # blank line after function docstring (HA style)
  "D203", # conflicts with D211
  "D213", # conflicts with D212
  "E501", # formatter handles line length
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["T201", "S603", "S607"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.eg_austria"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["custom_components.eg_austria"]
